<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7E1736">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Calcolatore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1F2; --surface:#FFFFFF; --surface-2:#EDE8EA; --line:#E2DADD;
  --ink:#241A1F; --muted:#7A6B72; --accent:#8E1B3E; --accent-ink:#FFFFFF;
  --hero:#7E1736; --hero-ink:#FFF3F6; --ok:#3F7D5B; --warn:#B3541E;
  --p:#8E1B3E; --c:#D8962F; --g:#3A7C7A;
  --shadow:0 1px 2px rgba(40,10,25,.06),0 8px 24px -12px rgba(40,10,25,.18);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#140D10; --surface:#1F1519; --surface-2:#2A1D22; --line:#3A2A31;
    --ink:#F6EDF0; --muted:#A8949C; --accent:#E5627F; --accent-ink:#2A0A14;
    --hero:#6E1230; --ok:#7FC49B; --warn:#E59A68;
    --p:#E5627F; --c:#E8AE54; --g:#6FBDB9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#140D10; --surface:#1F1519; --surface-2:#2A1D22; --line:#3A2A31;
  --ink:#F6EDF0; --muted:#A8949C; --accent:#E5627F; --accent-ink:#2A0A14;
  --hero:#6E1230; --ok:#7FC49B; --warn:#E59A68;
  --p:#E5627F; --c:#E8AE54; --g:#6FBDB9;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
body{min-height:100vh;display:flex;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#app{width:100%;max-width:520px;min-height:100vh;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(112px + env(safe-area-inset-bottom));position:relative}
h1{font-family:var(--display);font-weight:800;font-size:2.15rem;letter-spacing:-.035em;line-height:1.05;margin:6px 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem;max-width:34ch}
.screen{display:none}.screen.on{display:block;animation:in .22s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* navigation */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 28px));
  display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px;border-radius:999px;z-index:20;
  background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:var(--shadow),0 0 0 1px var(--line)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:999px;color:var(--muted);font-size:.72rem;font-weight:600;transition:background .2s,color .2s}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

/* generic */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.eyebrow{font-size:.78rem;color:var(--muted);font-weight:600;margin:0 0 2px}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.small{font-size:.82rem;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:.88rem;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.thumb{position:relative;flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;background:hsl(var(--h) 45% 90%);color:hsl(var(--h) 55% 28%);
  display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .thumb{background:hsl(var(--h) 30% 24%);color:hsl(var(--h) 70% 82%)}}
:root[data-theme="dark"] .thumb{background:hsl(var(--h) 30% 24%);color:hsl(var(--h) 70% 82%)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.thumb.sq{border-radius:var(--r-md)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.iconbtn svg{width:20px;height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn[disabled]{opacity:.45}

/* stepper */
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:50%;background:var(--surface-2);font-size:1.3rem;line-height:1;display:grid;place-items:center}
.stepper label{display:flex;align-items:baseline;gap:2px;min-width:78px;justify-content:center}
.stepper input{width:3.2ch;min-width:3.2ch;border:0;background:none;text-align:right;font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.03em;padding:0;field-sizing:content}
.stepper span{font-weight:600;color:var(--muted)}

/* converter */
.pair{position:relative;display:grid;gap:8px}
.pick{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 66px 14px 14px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow)}
.pick .thumb{width:58px;height:58px}
.pick.empty{box-shadow:0 0 0 1.5px var(--line) inset;background:transparent;color:var(--muted)}
.swap{position:absolute;right:22px;top:50%;transform:translateY(-50%);z-index:2;width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 0 0 5px var(--bg)}
.swap svg{width:20px;height:20px;transition:transform .3s}
.swap.spin svg{transform:rotate(180deg)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:999px;background:var(--surface-2)}
.seg button{padding:9px 4px;border-radius:999px;font-size:.84rem;font-weight:600;color:var(--muted);transition:background .18s,color .18s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);background:var(--hero);color:var(--hero-ink);padding:22px 20px 20px;min-height:178px}
.hero .big{font-family:var(--display);font-weight:800;font-size:5.4rem;line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.hero .big small{font-size:1.7rem;letter-spacing:-.02em;margin-left:4px;opacity:.75;font-weight:700}
.hero p{margin:10px 0 0;max-width:23ch;opacity:.86;font-size:.95rem}
.hero .photo{position:absolute;right:-26px;top:50%;transform:translateY(-50%);width:156px;height:156px;border-radius:50%;overflow:hidden;background:hsl(var(--h) 40% 86%);
  display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:3rem;color:hsl(var(--h) 55% 28%);box-shadow:0 0 0 8px rgba(255,255,255,.1)}
.hero .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.hero .ghost-num{opacity:.35}
.warn{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--ink);font-size:.9rem}
.warn b{color:var(--warn)}
.cmp{display:grid;gap:14px}
.cmp .head{display:grid;grid-template-columns:78px 1fr 1fr;gap:10px;font-size:.78rem;color:var(--muted);font-weight:600}
.cmp .line{display:grid;grid-template-columns:78px 1fr 1fr;gap:10px;align-items:center}
.cmp .lab{font-size:.84rem;font-weight:600}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--k);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.val{font-family:var(--display);font-weight:700;font-size:.95rem;margin-bottom:4px;font-variant-numeric:tabular-nums}
.val em{font-style:normal;font-weight:600;font-size:.74rem;margin-left:6px}
.val em.up{color:var(--ok)}.val em.down{color:var(--warn)}

/* foods grid */
.search{position:sticky;top:0;z-index:5;margin:0 -16px 10px;padding:8px 16px 4px;background:linear-gradient(var(--bg) 78%,transparent)}
.search label{display:flex;align-items:center;gap:10px;padding:0 16px;height:50px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:none;outline:0;min-width:0;font-size:1rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fcard{text-align:left;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.fcard .ph{position:relative;aspect-ratio:1/.7;display:grid;place-items:center;background:hsl(var(--h) 45% 92%);color:hsl(var(--h) 55% 30%);font-family:var(--display);font-weight:800;font-size:2.4rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fcard .ph{background:hsl(var(--h) 28% 22%);color:hsl(var(--h) 70% 82%)}}
.fcard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:6px}
.fcard .tx{padding:10px 12px 12px;display:grid;gap:6px}
.fcard .nm{font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.mix{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.mix i{display:block;height:100%}
.kc{font-size:.8rem;color:var(--muted);font-weight:600}
.kc b{font-family:var(--display);color:var(--ink);font-size:1rem}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(20,8,14,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;width:min(520px,100%);max-height:88vh;transform:translate(-50%,100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  background:var(--bg);border-radius:28px 28px 0 0;z-index:31;display:flex;flex-direction:column;overflow:hidden}
#sheet.on{transform:translate(-50%,0)}
#sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 4px;flex:none}
#sheet .body{overflow:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.listrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 6px;text-align:left;border-radius:var(--r-md)}
.listrow:active{background:var(--surface-2)}
.listrow .thumb{width:44px;height:44px;font-size:1rem}

/* nutrition label */
.label{border-top:8px solid var(--ink);margin-top:14px}
.label .t{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--ink);font-size:.82rem;font-weight:600}
.label .kcal{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0 8px;border-bottom:5px solid var(--ink)}
.label .kcal .num{font-size:2.6rem;font-weight:800;line-height:1}
.label .l{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.label .l.in{padding-left:18px;color:var(--muted)}
.label .l b{font-family:var(--display);font-variant-numeric:tabular-nums}
.tabs2{display:flex;gap:6px;margin:8px 0}
.bigph{position:relative;aspect-ratio:1.5;border-radius:var(--r-lg);overflow:hidden;display:grid;place-items:center;background:hsl(var(--h) 45% 92%);color:hsl(var(--h) 55% 30%);font-family:var(--display);font-weight:800;font-size:4rem}
.bigph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}

/* plan */
.slot{display:grid;gap:12px}
.slot .top{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.slot .bottom{display:flex;align-items:center;justify-content:space-between}
.ringwrap{display:flex;align-items:center;gap:18px}
.target{display:grid;gap:2px}
.target .tr{display:flex;align-items:center;gap:10px;padding:8px 0}
.target .tr+.tr{border-top:1px solid var(--line)}
.tag{font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.mini{padding:7px 14px;border-radius:99px;background:var(--surface-2);font-weight:600;font-size:.84rem}

/* shopping */
.add{display:flex;gap:8px}
.add label{flex:1;display:flex;align-items:center;padding:0 18px;height:52px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.add input{flex:1;border:0;background:none;outline:0;min-width:0}
.add .btn{width:52px;padding:0;min-height:52px}
.item{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.check{flex:none;width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 2px var(--line) inset;display:grid;place-items:center;color:transparent;transition:background .15s,color .15s,box-shadow .15s}
.check svg{width:16px;height:16px}
.item.done .check{background:var(--ok);box-shadow:none;color:#fff}
.item.done .tx{text-decoration:line-through;color:var(--muted)}
.item .tx{flex:1;min-width:0;font-weight:500}
.qty{font-family:var(--display);font-weight:700;color:var(--muted)}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.x svg{width:18px;height:18px}
.empty-note{text-align:center;color:var(--muted);padding:34px 12px}
.empty-note b{display:block;color:var(--ink);font-family:var(--display);font-size:1.15rem;margin-bottom:4px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 8px;font-weight:700;font-family:var(--display)}
.skel{height:76px;border-radius:var(--r-lg);background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
#toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:600;font-size:.9rem;z-index:40;transition:.25s;pointer-events:none;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:color-mix(in srgb,var(--warn) 14%,var(--surface));margin-bottom:12px;font-size:.9rem}

.nf{display:grid;gap:12px}
.nf label.f{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.nf input.i{width:100%;box-sizing:border-box;min-height:46px;padding:0 14px;border-radius:var(--r-sm);border:0;background:var(--surface-2);color:var(--ink);font-size:1rem}
.nf .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nf video{width:100%;border-radius:var(--r-md);background:#000;aspect-ratio:4/3;object-fit:cover}
.nf .prev{width:100%;max-height:200px;object-fit:contain;border-radius:var(--r-md);background:var(--surface-2)}
.addbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
</style>
</head>
<body>
<div id="app">
  <div id="banner"></div>

  <section class="screen" id="s-conv" aria-label="Converti"></section>
  <section class="screen" id="s-piano" aria-label="Piano pasti"></section>
  <section class="screen" id="s-cibi" aria-label="Alimenti"></section>
  <section class="screen" id="s-spesa" aria-label="Lista della spesa"></section>

  <nav id="nav" aria-label="Sezioni"></nav>
</div>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="body" id="sheetBody"></div></div>
<div id="toast" role="status"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const nf = (n, d = 0) => (Number(n) || 0).toLocaleString("it-IT", { maximumFractionDigits: d, minimumFractionDigits: 0 });
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

/* ---------- icons ---------- */
const IC = {
  conv: '<path d="M7 7h11l-3-3M17 17H6l3 3" stroke-linecap="round" stroke-linejoin="round"/>',
  piano: '<path d="M4 11h16M5 11a7 7 0 0 0 14 0M9 4v3M15 4v3" stroke-linecap="round"/>',
  cibi: '<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
  spesa: '<path d="M4 5h2l2 10h9l2-7H7.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/>',
  swap: '<path d="M8 4v16m0 0-3-3m3 3 3-3M16 20V4m0 0-3 3m3-3 3 3" stroke-linecap="round" stroke-linejoin="round"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4" stroke-linecap="round"/>',
  plus: '<path d="M12 5v14M5 12h14" stroke-linecap="round"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/>',
  x: '<path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/>'
};
const ico = (n, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- api ---------- */
const EXEC = "https://script.google.com/macros/s/AKfycbwy7Htp6Iteg9Ax0MSWM5p0LPB8GDVUIHQPnC4uIprwjoAL3Hk5CXVOkkRWiV0Y1oWC-w/exec";
const WRITES = new Set(["apiSpesaAggiungi", "apiSpesaToggle", "apiSpesaElimina", "apiSpesaSvuotaPresi", "apiSalvaPasto"]);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let TOKEN = new URLSearchParams(location.search).get("k") || lsGet("key", "");
if (new URLSearchParams(location.search).get("k")) { lsSet("key", TOKEN); history.replaceState(null, "", location.pathname); }
async function call(fn, args) {
  const r = await fetch(EXEC, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ k: TOKEN, fn, args }) });
  const j = await r.json();
  if (!j.ok) { const e = new Error(j.error || "Errore del server"); e.server = true; throw e; }
  return j.data;
}
let flushing = false;
async function flush() {
  if (flushing) return; flushing = true;
  try {
    let q = lsGet("queue", []);
    while (q.length) {
      try { await call(q[0].fn, q[0].args); } catch (e) { if (!e.server) break; }
      q = lsGet("queue", []); q.shift(); lsSet("queue", q);
    }
  } finally { flushing = false; }
}
async function api(fn, ...args) {
  if (!TOKEN) throw new Error("Manca la chiave di accesso");
  if (!WRITES.has(fn)) return call(fn, args);
  const q = lsGet("queue", []);
  if (q.length) { q.push({ fn, args }); lsSet("queue", q); flush(); return true; }
  try { return await call(fn, args); }
  catch (e) { if (e.server) throw e; q.push({ fn, args }); lsSet("queue", q); return true; }
}

/* ---------- converter ---------- */
const PRIO = { Calorie: "kcal", Proteine: "pr", Carboidrati: "ch", Grassi: "gr" };
function calcConv() {
  const b = foodById(S.conv.base), n = foodById(S.conv.nuovo);
  if (!b || !n) return null;
  const k = PRIO[S.conv.prio];
  const g1 = n[k] > 0 ? Math.round((b[k] * S.conv.g) / n[k]) : 0;
  const mk = (f, g) => ({ kcal: f.kcal * g / 100, pr: f.pr * g / 100, ch: f.ch * g / 100, gr: f.gr * g / 100 });
  const A = mk(b, S.conv.g), B = mk(n, g1);
  const warn = S.conv.prio !== "Proteine" && g1 > 0 && B.pr < A.pr * 0.7;
  return { b, n, g1, A, B, warn };
}

function afterConv() {

    const el = $("#bigNum"), from = lastBig, to = r.g1, t0 = performance.now();

      const step = t => { const k = Math.min(1, (t - t0) / 320), e = 1 - Math.pow(1 - k, 3); el.firstChild.nodeValue = nf(Math.round(from + (to - from) * e)); if (k < 1) requestAnimationFrame(step); };

function uniqueTargets() {
  const seen = new Set(), out = [];

}

function leggiFoto(file) {

    NF.foto = c.toDataURL("image/jpeg", .82); URL.revokeObjectURL(url); drawNuovo();

    box.innerHTML = `<video playsinline muted autoplay></video><div class="small" style="margin-top:6px">Inquadra il codice a barre.</div>`;
    const v = box.querySelector("video"); v.srcObject = camStream; await v.play();
    const det = new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e"] });
    camTimer = setInterval(async () => {
      try { const r = await det.detect(v); if (r.length) { const code = r[0].rawValue; stopCam(); cercaCodice(code); } } catch (e) {}
    }, 300);
  } catch (e) { box.innerHTML = `<div class="small">Non riesco ad aprire la fotocamera: permetti l'accesso e riprova, oppure scrivi il codice nel campo qui sotto.</div>`; }
}
async function cercaCodice(code) {
  code = String(code || "").replace(/\D/g, ""); if (code.length < 6) return toast("Codice non valido");
  const dup = (S.data.alimenti || []).find(f => String(f.barcode).replace(/\D/g, "") === code);
  if (dup) { toast("C'è già: " + dup.nome); return; }
  NF.barcode = code; $("#camBox").innerHTML = `<div class="small">Cerco il prodotto…</div>`;
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_it,brands,nutriments`);
    const j = await r.json();
    if (j.status !== 1) { toast("Prodotto non trovato: fotografa l'etichetta o scrivi i valori"); drawNuovo(); return; }
    const p = j.product, n = p.nutriments || {}, v = k => n[k] === undefined || n[k] === "" ? "" : Math.round(Number(n[k]) * 10) / 10;
    const marca = (p.brands || "").split(",")[0].trim(), nome = p.product_name_it || p.product_name || "";
    if (!NF.nome) NF.nome = marca && nome && !norm(nome).includes(norm(marca)) ? `${nome} ${marca}` : nome;
    Object.assign(NF, { kcal: v("energy-kcal_100g"), gr: v("fat_100g"), sat: v("saturated-fat_100g"), ch: v("carbohydrates_100g"), zu: v("sugars_100g"), fi: v("fiber_100g"), pr: v("proteins_100g"), sa: v("salt_100g") });
    NF.extra = "Valori per 100 g. Fonte: Open Food Facts" + (marca ? " (" + marca + ")" : "") + ".";
    toast("Trovato: controlla i valori e scegli il gruppo");
  } catch (e) { toast("Non riesco a cercare: sei offline?"); }
  drawNuovo();
}
async function salvaNuovo(btn) {
  const nome = (NF.nome || "").trim();
  if (nome.length < 2) return toast("Scrivi il nome");
  if (!NF.cat) return toast("Scegli il gruppo");
  if (foodByName(nome)) return toast("C'è già un alimento con questo nome");
  if ((NF.kcal === "" || NF.kcal === undefined) && !NF.foto && !NF.barcode) return toast("Servono le calorie, la foto o il codice");
  btn.disabled = true; btn.textContent = "Salvo…";
  try {
    const r = await api("apiAggiungiAlimento", { nome, cat: NF.cat, barcode: NF.barcode, kcal: NF.kcal, gr: NF.gr, sat: NF.sat, ch: NF.ch, zu: NF.zu, pr: NF.pr, fi: NF.fi, sa: NF.sa, extra: NF.extra, foto: NF.foto });
    if (r && r.dup) { toast("C'è già: " + r.nome); btn.disabled = false; btn.textContent = "Salva alimento"; return; }
    closeSheet(); toast(NF.kcal === "" || NF.kcal === undefined ? "Aggiunto: i valori arrivano tra poco" : "Aggiunto"); load(true);
  } catch (e) { toast(e.server ? e.message : "Serve internet per aggiungere un alimento"); btn.disabled = false; btn.textContent = "Salva alimento"; }
}

/* ---------- plan ---------- */
const slotDi = g => g === "Proteine" ? "prot" : g === "Carboidrati" ? "carbo" : g === "Verdura" ? "verd" : "extra";
const eqKey = (p, g) => `${p}|${g}`;
const ORDINE_PASTI = ["Pranzo", "Cena", "Colazione", "Spuntino mattina", "Merenda", "Spuntino sera", "Durante la giornata"];
function pianoPasti() {
  const p = [...new Set((S.data.equiv || []).map(r => r.pasto))], pos = x => { const i = ORDINE_PASTI.indexOf(x); return i < 0 ? 99 : i; };
  return p.sort((a, b) => pos(a) - pos(b));
}
function pianoPastoDefault() {
  const h = new Date().getHours(), pp = pianoPasti();
  const w = h < 10 ? "Colazione" : h < 12 ? "Spuntino mattina" : h < 15 ? "Pranzo" : h < 18 ? "Merenda" : h < 21 ? "Cena" : "Spuntino sera";
  return pp.includes(w) ? w : pp[0];
}
const kcalEq = r => { const f = foodByName(r.nome); return f ? f.kcal * r.g / 100 : null; };
const segno = d => (d > 0 ? "+" : d < 0 ? "−" : "±") + nf(Math.abs(d)) + " kcal";
const coloreDelta = d => Math.abs(d) < 1 ? "var(--muted)" : d > 0 ? "var(--warn)" : "var(--ok)";
// Alimenti del tuo database adatti al gruppo (non nel piano): grammi per avere le stesse calorie dell'alimento di riferimento
function propriFiltro(g) {
  const k = norm(g);
  if (k === "proteine" || k === "spuntino proteico") return f => grp(f) === "Proteine";
  if (k === "carboidrati" || k === "cereali") return f => grp(f) === "Carboidrati";
  if (k === "verdura") return f => grp(f) === "Verdura";
  if (k === "frutta") return f => norm(f.sub).includes("frutta") && !norm(f.sub).includes("secca");
  if (k === "latticini") return f => norm(f.sub).includes("latticin");
  if (k === "grassi buoni") return f => /grassi|secca/.test(norm(f.sub));
  return null;
}
function propri(g, piano, kr) {
  const ok = propriFiltro(g); if (!ok || kr === null || !S.data) return [];
  const nomi = new Set(piano.map(r => norm(r.nome)));
  return S.data.alimenti.filter(f => f.kcal > 0 && !nomi.has(norm(f.nome)) && ok(f))
    .sort((a, b) => a.nome.localeCompare(b.nome, "it"))
    .map(f => ({ pasto: S.piano.pasto, gruppo: g, nome: f.nome, g: Math.max(5, Math.round(kr / f.kcal * 100 / 5) * 5), misura: "stesse calorie del piano", freq: "I tuoi alimenti", rif: 0, proprio: 1 }));
}
// Gruppi del pasto: all'inizio nessuna scelta. Le righe dello stesso gruppo sono alternative tra loro.
function pianoGruppi() {
  const p = S.piano, righe = (S.data.equiv || []).filter(r => r.pasto === p.pasto && r.gruppo !== "_nota");
  return [...new Set(righe.map(r => r.gruppo))].map(g => {
    const piano = righe.filter(r => r.gruppo === g), rif = piano.find(r => r.rif) || piano[0], kr = kcalEq(rif);
    const alt = piano.concat(propri(g, piano, kr));
    const sc = alt.find(r => r.nome === p.sel[eqKey(p.pasto, g)]) || null;
    const kc = sc ? kcalEq(sc) : null;
    return { g, alt, rif, sc, kc, kr, delta: sc && kc !== null && kr !== null ? kc - kr : null };
  });
}
function pianoTot(gr) {
  const t = { scelti: 0, kcal: 0, delta: 0, ignoti: 0 };
  for (const x of gr) { if (!x.sc) continue; t.scelti++; if (x.delta === null) t.ignoti++; else { t.kcal += x.kc; t.delta += x.delta; } }
  return t;
}
function eqThumb(nome, gruppo) {
  const f = foodByName(nome);
  return thumb(f || { nome, foto: "", cat: gruppo === "Proteine" ? "Proteine" : gruppo === "Carboidrati" ? "Carboidrati" : gruppo === "Verdura" ? "Verdura" : "Extra" });
}
const eqMisura = r => [r.misura, r.freq].filter(Boolean).join(" · ");
function viewPiano() {
  const p = S.piano;
  if (!S.data) return "";
  const pasti = pianoPasti();
  if (!pasti.length) return `<h1>Piano pasti</h1><div class="empty-note"><b>Il piano non è ancora nel foglio</b>Serve la scheda Equivalenze_Piano.</div>`;
  if (!pasti.includes(p.pasto)) p.pasto = pianoPastoDefault();
  const gr = pianoGruppi(), T = pianoTot(gr), note = (S.data.equiv || []).filter(r => r.pasto === p.pasto && r.gruppo === "_nota");
  const recent = S.data.piano.slice(0, 5);
  const riepilogo = T.scelti
    ? `<div class="card"><div class="eyebrow">Rispetto al piano</div><div class="num" style="font-size:2.6rem;font-weight:800;line-height:1;color:${coloreDelta(T.delta)}">${segno(T.delta)}</div><div class="small" style="margin-top:6px">${nf(T.kcal)} kcal scelte${T.ignoti ? ` · per ${T.ignoti} ${T.ignoti === 1 ? "alimento" : "alimenti"} mancano i valori` : ""}</div></div>`
    : `<div class="card small" style="padding:14px 16px">Scegli un alimento per ogni gruppo: ti dico quanti grammi e di quanto cambiano le calorie rispetto al piano.</div>`;
  return `<h1>Piano pasti</h1><p class="sub">Per ogni gruppo scegli una sola alternativa.</p>
  <div class="chips" style="margin-bottom:10px">${pasti.map(x => `<button class="chip" aria-pressed="${p.pasto === x}" data-pasto="${esc(x)}">${esc(x)}</button>`).join("")}</div>
  <div class="stack">
    ${note.map(n => `<div class="card small" style="padding:12px 16px">${esc(n.nome)}</div>`).join("")}
    ${riepilogo}
    ${gr.map(x => x.sc ? `<div class="card slot"><button class="top" data-gr="${esc(x.g)}">${eqThumb(x.sc.nome, x.g)}<span class="grow"><span class="eyebrow">${esc(x.g)}</span><span class="name" style="display:block;font-size:1.05rem">${esc(x.sc.nome)}</span><span class="small">${eqMisura(x.sc) ? esc(eqMisura(x.sc)) : "tocca per cambiare"}</span></span><span class="num" style="font-weight:800;font-size:1.7rem;line-height:1">${nf(x.sc.g)}<small style="font-size:.9rem;color:var(--muted)"> g</small></span></button>
      <div class="bottom"><span class="small">${x.delta === null ? "calorie non disponibili" : `<b style="color:${coloreDelta(x.delta)}">${segno(x.delta)}</b> rispetto a ${esc(x.rif.nome)} (${nf(x.kc)} kcal)`}</span><button class="mini" data-reset="${esc(x.g)}">Togli</button></div></div>`
      : `<div class="card slot"><button class="top" data-gr="${esc(x.g)}"><span class="iconbtn" style="width:52px;height:52px">${ico("plus")}</span><span class="grow"><span class="eyebrow">${esc(x.g)}</span><span class="name" style="display:block;font-size:1.05rem">Scegli un alimento</span><span class="small">${x.alt.length} alternative</span></span></button></div>`).join("")}
    <button class="btn" id="savePasto" ${T.scelti ? "" : "disabled"}>Segna ${esc(p.pasto.toLowerCase())} come mangiato</button>
  </div>
  ${recent.length ? `<div class="sec"><span>Segnati di recente</span></div><div class="card">${recent.map(r => `<div class="item"><span class="grow"><span class="name" style="display:block">${esc(r.pasto)} ${r.data ? "· " + esc(r.data) : ""}</span><span class="small">${esc([r.prot, r.carbo, r.verd, r.extra].filter(Boolean).join(", ") || "—")}</span></span>${r.kcal ? `<span class="num" style="font-weight:700">${nf(r.kcal)} kcal</span>` : ""}</div>`).join("")}</div>` : ""}`;
}
function bindPiano(root) {
  root.addEventListener("click", async e => {
    const ps = e.target.closest("[data-pasto]"); if (ps) { S.piano.pasto = ps.dataset.pasto; savePiano(); return render(); }
    const rs = e.target.closest("[data-reset]"); if (rs) { delete S.piano.sel[eqKey(S.piano.pasto, rs.dataset.reset)]; savePiano(); return render(); }
    const gr = e.target.closest("[data-gr]");
    if (gr) {
      const x = pianoGruppi().find(y => y.g === gr.dataset.gr); if (!x) return;
      let last = null, html = `<h2 style="font-family:var(--display);margin:4px 4px 2px;font-size:1.4rem">${esc(x.g)}</h2><p class="small" style="margin:0 6px 6px">Le calorie sono confrontate con ${esc(x.rif.nome)} del piano.</p>`;
      x.alt.forEach((r, i) => {
        if ((r.freq || "") !== last && r.freq) html += `<div class="eyebrow" style="margin:14px 6px 4px">${esc(r.freq)}</div>`;
        last = r.freq || "";
        const k = kcalEq(r), d = k !== null && x.kr !== null ? k - x.kr : null;
        html += `<button class="listrow" data-eq="${i}">${eqThumb(r.nome, x.g)}<span class="grow"><span class="name" style="display:block">${esc(r.nome)}</span><span class="small">${r.misura ? esc(r.misura) + " · " : ""}${d === null ? "calorie non disponibili" : `<b style="color:${coloreDelta(d)}">${segno(d)}</b>`}</span></span><span class="num" style="font-weight:800">${nf(r.g)} g</span></button>`;
      });
      openSheet(html);
      $("#sheetBody").onclick = ev => { const b = ev.target.closest("[data-eq]"); if (!b) return; S.piano.sel[eqKey(S.piano.pasto, x.g)] = x.alt[Number(b.dataset.eq)].nome; savePiano(); closeSheet(); render(); };
      return;
    }
    if (e.target.closest("#savePasto")) {
      const btn = e.target.closest("#savePasto"); btn.disabled = true;
      const acc = { prot: [], carbo: [], verd: [], extra: [] }, gm = { prot: 0, carbo: 0, verd: 0, extra: 0 }, G = pianoGruppi(), T = pianoTot(G);
      for (const x of G) { if (!x.sc) continue; const s = slotDi(x.g); acc[s].push(x.sc.nome); gm[s] += x.sc.g; }
      try {
        await api("apiSalvaPasto", { pasto: S.piano.pasto, prot: acc.prot.join(", "), gProt: gm.prot, carbo: acc.carbo.join(", "), gCarbo: gm.carbo, verd: acc.verd.join(", "), gVerd: gm.verd, extra: acc.extra.join(", "), gExtra: gm.extra, kcal: Math.round(T.kcal * 100) / 100 });
        for (const x of G) delete S.piano.sel[eqKey(S.piano.pasto, x.g)];
        savePiano(); toast("Segnato"); render(); load(true);
      } catch (er) { toast("Non sono riuscito a salvare"); btn.disabled = false; }
    }
  });
}

/* ---------- shopping ---------- */
function viewSpesa() {
  const L = S.data ? S.data.spesa : [], open = L.filter(i => !i.preso), done = L.filter(i => i.preso);
  const sugg = S.data ? S.data.storico.filter(s => !L.some(i => norm(i.nome) === norm(s))).slice(0, 10) : [];
  const row = i => `<div class="item ${i.preso ? "done" : ""}" data-id="${esc(i.id)}"><button class="check" data-toggle="${esc(i.id)}" aria-label="${i.preso ? "Rimetti in lista" : "Segna come preso"}: ${esc(i.nome)}">${ico("check", 2.6)}</button><span class="tx">${esc(i.nome)}</span>${i.qty > 1 ? `<span class="qty">×${i.qty}</span>` : ""}<button class="x" data-del="${esc(i.id)}" aria-label="Togli ${esc(i.nome)}">${ico("x")}</button></div>`;
  return `<h1>Spesa</h1><p class="sub">${open.length ? `${open.length} ${open.length === 1 ? "cosa" : "cose"} da prendere.` : "Niente da prendere, per ora."}</p>
  <form class="add" id="addForm"><label><input id="addIn" placeholder="Aggiungi, ad esempio “latte per 2”" autocomplete="off" aria-label="Nuovo articolo"></label><button class="btn" aria-label="Aggiungi">${ico("plus", 2.4)}</button></form>
  ${sugg.length ? `<div class="chips" style="margin-top:10px">${sugg.map(s => `<button class="chip" data-add="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : ""}
  ${open.length ? `<div class="card" style="margin-top:12px;padding:6px 16px">${open.map(row).join("")}</div>` : `<div class="empty-note"><b>La lista è vuota</b>Scrivi qui sopra o tocca un suggerimento.</div>`}
  ${done.length ? `<div class="sec"><span>Presi (${done.length})</span><button class="mini" data-clear>Svuota</button></div><div class="card" style="padding:6px 16px">${done.map(row).join("")}</div>` : ""}`;
}
function bindSpesa(root) {
  const add = async (txt) => {
    txt = String(txt || "").trim(); if (!txt) return;
    const m = txt.match(/\s+per\s+(\d+)\s*$/i), qty = m ? parseInt(m[1]) : 1, nome = (m ? txt.replace(/\s+per\s+\d+\s*$/i, "") : txt).trim();
    const low = nome.toLowerCase(), cap = low.charAt(0).toUpperCase() + low.slice(1);
    S.data.spesa.unshift({ id: "tmp" + Date.now(), nome: cap, preso: false, qty }); render();
    try { await api("apiSpesaAggiungi", cap, qty); load(true); } catch (e) { toast("Non sono riuscito ad aggiungerlo"); load(true); }
  };
  root.addEventListener("submit", e => { e.preventDefault(); const i = $("#addIn"); const v = i.value; i.value = ""; add(v); });
  root.addEventListener("click", async e => {
    const a = e.target.closest("[data-add]"); if (a) return add(a.dataset.add);
    const t = e.target.closest("[data-toggle]");
    if (t) { const it = S.data.spesa.find(i => i.id === t.dataset.toggle); if (!it) return; it.preso = !it.preso; render(); if (String(it.id).startsWith("tmp")) return; try { await api("apiSpesaToggle", it.id, it.preso); } catch (er) { toast("Non sono riuscito a salvare"); load(true); } return; }
    const d = e.target.closest("[data-del]");
    if (d) { const id = d.dataset.del; S.data.spesa = S.data.spesa.filter(i => i.id !== id); render(); if (!id.startsWith("tmp")) try { await api("apiSpesaElimina", id); } catch (er) { toast("Non sono riuscito a toglierlo"); load(true); } return; }
    if (e.target.closest("[data-clear]")) { const ids = S.data.spesa.filter(i => i.preso).map(i => i.id); S.data.spesa = S.data.spesa.filter(i => !i.preso); render(); try { await api("apiSpesaSvuotaPresi"); toast("Lista ripulita"); } catch (er) { load(true); } }
  });
}

/* ---------- shell ---------- */
const TABS = [["conv", "Converti"], ["piano", "Piano"], ["cibi", "Alimenti"], ["spesa", "Spesa"]];
const VIEWS = { conv: [viewConv, bindConv, afterConv], piano: [viewPiano, bindPiano], cibi: [viewCibi, bindCibi], spesa: [viewSpesa, bindSpesa] };
$("#nav").innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" aria-label="${l}">${ico(k)}<span>${l}</span></button>`).join("");
$("#nav").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) setTab(b.dataset.tab); });
function setTab(t) { S.tab = t; LS.set("tab", t); render(); scrollTo({ top: 0 }); }
const bound = {};
function render() {
  document.querySelectorAll("#nav button").forEach(b => b.dataset.tab === S.tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  for (const [k] of TABS) {
    const root = $("#s-" + k), on = k === S.tab;
    if (!on) { root.classList.remove("on"); continue; }
    const wasOn = root.classList.contains("on"), keep = document.activeElement && root.contains(document.activeElement) ? document.activeElement.id : null;
    if (!S.data) root.innerHTML = `<h1>${TABS.find(x => x[0] === k)[1]}</h1><div class="stack" style="margin-top:20px"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`;
    else root.innerHTML = VIEWS[k][0]();
    if (!bound[k]) { VIEWS[k][1](root); bound[k] = true; }
    if (VIEWS[k][2] && S.data) VIEWS[k][2]();
    root.classList.add("on"); if (wasOn) root.style.animation = "none";
    else root.style.animation = "";
    if (keep) { const el = document.getElementById(keep); if (el && keep !== "q") el.focus(); }
  }
}
render();
function chiedi() {
  banner(`<div class="banner"><span>Incolla il link completo che ti ho dato</span><input id="kin" style="min-width:0;flex:1;border-radius:8px;border:0;padding:8px"><button class="mini" id="kok">Salva</button></div>`);
  $("#kok").onclick = () => { const v = $("#kin").value.trim(); const m = v.match(/[?&]k=([A-Za-z0-9]+)/); TOKEN = m ? m[1] : v; lsSet("key", TOKEN); banner(""); load(); };
}
if (TOKEN) load(); else chiedi();
addEventListener("online", () => { load(true); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
